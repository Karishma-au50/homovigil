<p-toast></p-toast>
<div class="flex flex-wrap justify-between flex-col-reverse items-end md:flex-row md:items-center gap-4 p-4">
    <!-- Search Bar -->
    <div class="flex bg-white border rounded-md shadow-sm">
        <input type="text" placeholder="Search users..." class="p-2 rounded-l-md outline-none w-[200px]"
            (input)="onGlobalFilter(dt, $event)" />
        <button class="bg-red-600 text-white px-4 rounded-r-md hover:bg-red-700 transition-colors">
            Search
        </button>
    </div>

    <!-- Action Button -->
    <p-button label="New User" icon="pi pi-user-plus" (click)="addUser()" styleClass="p-button-danger"></p-button>
</div>

<!-- ADD / EDIT USER DIALOG -->
<p-dialog [(visible)]="visible" [modal]="true" [closable]="false" [header]="modalTitle" styleClass="w-[28rem] md:w-[35rem]">
    <ng-template pTemplate="content">
        <!-- Connecting to the existing detail component -->
        <app-users-detail [formData]="selectedUser" (closeDialog)="closeDialog($event)">
        </app-users-detail>
    </ng-template>
</p-dialog>

<!-- MAIN TABLE -->
<p-table #dt [value]="isLoading ? skeletonData : rows" [globalFilterFields]="['name', 'phone', 'email', 'role']" [paginator]="true" [rows]="10"
    styleClass="w-full text-m" class="p-datatable-striped rounded-xl shadow-lg min-w-[800px]">

    <ng-template pTemplate="header">
        <tr class="bg-red-700 text-white text-m px-5 py-3 font-semibold">
            <th class="rounded-tl-xl !px-5 !py-3">S.No</th>
            <th class="!px-5 !py-3">Name</th>
            <th class="!px-5 !py-3">Phone</th>
            <th class="!px-5 !py-3">Email</th>
            <th class="!px-5 !py-3">Role</th>
            <th class="rounded-tr-xl !px-5 !py-3">Action</th>
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-row let-i="rowIndex">
        <tr class="hover:bg-red-50" [ngClass]="stripe(i)">

            <!-- SHIMMER/SKELETON STATE -->
            <ng-container *ngIf="isLoading">
                <td class="!px-5 !py-3"><p-skeleton></p-skeleton></td>
                <td class="!px-5 !py-3"><p-skeleton></p-skeleton></td>
                <td class="!px-5 !py-3"><p-skeleton></p-skeleton></td>
                <td class="!px-5 !py-3"><p-skeleton></p-skeleton></td>
                <!-- Custom skeleton for the role badge -->
                <td class="!px-5 !py-3"><p-skeleton width="4rem" height="1.5rem" borderRadius="16px"></p-skeleton></td>
                <!-- Custom skeleton for the action buttons -->
                <td class="!px-5 !py-3">
                    <div class="flex items-center gap-2">
                        <p-skeleton shape="circle" size="2rem"></p-skeleton>
                        <span class="text-gray-400">|</span>
                        <p-skeleton shape="circle" size="2rem"></p-skeleton>
                    </div>
                </td>
            </ng-container>

            <ng-container *ngIf="!isLoading">
                <td class="!px-5 !py-3">{{ i + 1 }}</td>
                <td class="!px-5 !py-3 font-medium">
                    {{ row.name | titlecase }}
                </td>
                <td class="!px-5 !py-3">{{ row.phone }}</td>
                <td class="!px-5 !py-3">{{ row.email || 'N/A' }}</td>
                <td class="!px-5 !py-3">
                    <span class="border px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider"
                        [ngClass]="getRoleColors(row.role)">
                        {{ row.role }}
                    </span>
                </td>
                <td class="!px-5 !py-3">
                    <div class="flex items-center gap-2">
                        <button pButton type="button" icon="pi pi-pencil"
                            class="p-button-text text-red-600 hover:text-red-800" pTooltip="Edit" (click)="editUser(row)">
                        </button>
    
                        <span class="text-gray-400">|</span>
    
                        <button pButton type="button" icon="pi pi-trash"
                            class="p-button-text text-red-600 hover:text-red-800" pTooltip="Delete"
                            (click)="confirmDelete(row)">
                        </button>
                    </div>
                </td>
            </ng-container>
            
        </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
        <tr *ngIf="!isLoading">
            <td colspan="6" class="text-center py-8 text-gray-700 text-xl">
                <div class="flex justify-center items-center h-full">No users found</div>
            </td>
        </tr>
    </ng-template>

</p-table>

<p-confirmDialog header="Confirmation" icon="pi pi-exclamation-triangle" [style]="{width: '450px'}" [closable]="false" >
    <ng-template pTemplate="accept">
        <!-- Yes button (Solid Red) -->
        <p-button label="Yes" icon="pi pi-check" severity="danger"></p-button>
    </ng-template>
    <ng-template pTemplate="reject">
        <!-- No button (Outlined Grey) -->
        <p-button label="No" icon="pi pi-times" severity="secondary" [outlined]="true"></p-button>
    </ng-template>
</p-confirmDialog>
