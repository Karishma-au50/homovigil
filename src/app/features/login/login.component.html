<div class="flex min-h-screen bg-white">
  <div class="form-section !w-full !p-[50px] md:!w-[40%] md:p-![100px]">
    <p class="logo !mb-0">HaemoVigil</p>
    <img src="assets/logo.png" alt="error" class="w-[18rem] md:w-[22rem] mb-4" />
    <h2 class="!m-0">Create an account</h2>
    <p>Let's begin your Blood Bank</p>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <input type="text" formControlName="phone" placeholder="Enter phone number" maxlength="10" (input)="onPhoneInput($event)" class="focus:outline-none focus:ring-2 focus:ring-red-500 transition" />
      <input formControlName="password" placeholder="Enter password" type="password" class="focus:outline-none focus:ring-2 focus:ring-red-500 transition" />
      <!-- <button class="primary focus:outline-none focus:ring-4 focus:ring-red-300 transition" type="submit">Login</button> -->
      <button class="primary focus:outline-none focus:ring-4 focus:ring-red-300 transition flex justify-center items-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed" type="submit" [disabled]="isLoading">
        <i *ngIf="isLoading" class="pi pi-spin pi-spinner"></i>
        <span>{{ isLoading ? 'Logging in...' : 'Login' }}</span>
      </button> 
    </form>
  </div>

  <div class="!hidden md:!flex image-section">
    <div class="overlay-text ml-36">
      <h2>Let’s empower your Blood Bank today with Haemovigil</h2>
      <p>
        When you donate with Haemovigil, you're not just giving blood – you're
        giving hope, health, and a second chance.
      </p>
    </div>
  </div>
</div>
